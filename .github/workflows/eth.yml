name: Ethereum CI

on:
  pull_request:
    branches: [main]
    paths:
      - "protocol/ethereum/**"
      - ".github/workflows/eth.yml"
  push:
    branches: [main]
    paths:
      - "protocol/ethereum/**"
      - ".github/workflows/eth.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ethereum:
    name: Ethereum protocol
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: protocol/ethereum
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: protocol/ethereum/package-lock.json
      - run: npm ci
      - run: npm run build:production
      - run: npm run typecheck
      - run: npm test
