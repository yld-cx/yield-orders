name: Infra CI

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/workers/rpc.ts"
      - "infra/workers/data/**"
      - "infra/workers/resolver/**"
      - "infra/workers/mcp/**"
      - "skills/**"
      - "product/packages/sdk/**"
      - "product/public/yieldlist.json"
      - "product/package-lock.json"
      - ".github/workflows/infra.yml"
  push:
    branches: [main]
    paths:
      - "infra/workers/rpc.ts"
      - "infra/workers/data/**"
      - "infra/workers/resolver/**"
      - "infra/workers/mcp/**"
      - "skills/**"
      - "product/packages/sdk/**"
      - "product/public/yieldlist.json"
      - "product/package-lock.json"
      - ".github/workflows/infra.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data:
    name: Data Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/workers/data
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: infra/workers/data/.node-version
          cache: npm
          cache-dependency-path: infra/workers/data/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npx prettier --check .
      - name: Typecheck and test
        run: npm run check
      - name: Validate migrations
        run: npm run migrate:local
      - name: Build Worker
        run: npm run build

  resolver:
    name: Resolver Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            product/package-lock.json
            infra/workers/resolver/package-lock.json
      - name: Install shared SDK dependencies
        run: npm ci --prefix product
      - name: Build shared SDK
        run: npm run build --workspace=@yld-cx/sdk --prefix product
      - name: Install resolver dependencies
        run: npm ci --prefix infra/workers/resolver
      - name: Typecheck, test and package resolver
        run: npm run check --prefix infra/workers/resolver

  mcp:
    name: Skills and MCP Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: infra/workers/mcp/.node-version
          cache: npm
          cache-dependency-path: |
            product/package-lock.json
            skills/package-lock.json
            infra/workers/mcp/package-lock.json
      - name: Install dependencies and build Skills
        run: npm run setup --prefix infra/workers/mcp
      - name: Test Skills
        run: npm test --prefix skills
      - name: Typecheck, test and package MCP
        run: npm run check --prefix infra/workers/mcp
