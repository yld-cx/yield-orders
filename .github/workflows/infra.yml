name: Infra CI

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/workers/data/**"
      - ".github/workflows/infra.yml"
  push:
    branches: [main]
    paths:
      - "infra/workers/data/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data:
    name: Data Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/workers/data
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: infra/workers/data/.node-version
          cache: npm
          cache-dependency-path: infra/workers/data/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npx prettier --check .
      - name: Typecheck and test
        run: npm run check
      - name: Validate migrations
        run: npm run migrate:local
      - name: Build Worker
        run: npm run build
